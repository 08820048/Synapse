[workspace]
members = ["crates/synapse-core", "crates/synapse-ui"]
exclude = ["vendor/gpui-component"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-animation = "=0.2.63"
gpui-component = { path = "vendor/gpui-component" }
gpui-component-assets = "=0.5.1"
ropey = "=1.6.1"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
rusty-mermaid = { version = "=0.2.0", features = ["svg"] }
synapse-core = { path = "crates/synapse-core" }
trash = "=5.2.6"
writ = { version = "=0.18.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
