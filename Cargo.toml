[workspace]
members = ["crates/synapse-core", "crates/synapse-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-animation = "=0.2.63"
ropey = "=1.6.1"
synapse-core = { path = "crates/synapse-core" }
trash = "=5.2.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
