name: Feature request
description: Propose a change that fits a native, local-first Markdown editor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [AGENT.md](https://github.com/08820048/Synapse/blob/main/AGENT.md)
        first. Features that need a web stack, a required account, or a database
        are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing in the current app?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest native change that would help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Vault / files
        - Todos / bookmarks
        - Settings / i18n
        - Performance
        - Docs / tooling
        - Other
    validations:
      required: true
